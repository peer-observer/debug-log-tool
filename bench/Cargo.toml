[package]
name = "drnlog-bench"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace root, so criterion stays out of the main Cargo.lock and
# `cargo build --all-targets` in CI doesn't have to compile it.
[workspace]

[dependencies]
drnlog = { path = "../crates/drnlog" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pipeline"
harness = false
